name: blink
description: "BLINK — The World Changes When You Look Away"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  audioplayers: ^6.4.0
  vibration: ^2.0.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
    - assets/images/characters/
    - assets/images/world/
    - assets/images/gems/
    - assets/images/rewards/
    - assets/images/objects/
    - assets/audio/
